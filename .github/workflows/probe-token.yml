# Throwaway probe: can GITHUB_TOKEN open pull requests on this fork, on aged
# refs, and with a retry after a fresh push? Delete when the answer is in.
name: probe-token

on: push

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repo settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" 2>&1 || true
      - name: Probe the workflow token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try_pr() {
            echo "=== head $1 ($2) ==="
            local out
            out=$(gh pr create --base main --head "$1" \
              --title "probe: $1" --body "Throwaway probe. Closing at once." 2>&1) \
              && { echo "CREATED: $out"; gh pr close "${out##*/}" || true; return 0; } \
              || { echo "REFUSED: $out"; return 1; }
          }
          try_pr sync/2026-10-13 aged
          try_pr sync/probe-fresh aged
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git switch --create probe2/race-test
          git commit --allow-empty -m "probe: fresh head"
          git push origin probe2/race-test
          try_pr probe2/race-test immediate || true
          sleep 12
          try_pr probe2/race-test retry || true

# SPDX-License-Identifier: GPL-3.0-or-later
# The fixture tests for the fork tooling. A pull request that touches .fork/
# or the workflows runs every fixture, and the merge push re-runs them as a
# smoke test. The fixtures come from main, never from the pull request tree,
# so a pull request cannot weaken a test to make its own change pass. This
# does not stop a hostile pull request: the fixtures run its code with the
# same user. A fixture that a pull request adds or changes runs only after
# the merge, so run it locally first. test-check-clean.sh
# needs the clean branch as a local branch; the first step materializes it
# from origin/clean.
name: fork-tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.fork/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.fork/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  tests:
    # GitHub moves the ubuntu-latest label to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Make clean a local branch
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/clean >/dev/null; then
            echo "FAIL: origin/clean is missing; run .fork/sync-upstream.sh once" >&2
            exit 1
          fi
          git branch --no-track clean origin/clean
      - name: Run the fixtures from main
        # Every .fork/tests/test-*.sh on main runs. All of them are read from
        # one main commit before any runs, because a fixture runs pull
        # request code that could move origin/main.
        run: |
          main="$(git rev-parse --verify 'origin/main^{commit}')"
          mkdir "$RUNNER_TEMP/fixtures"
          git ls-tree -z "$main" -- .fork/tests/ > "$RUNNER_TEMP/tree"
          names=()
          while IFS= read -r -d '' entry; do
            path="${entry#*$'\t'}"
            name="${path##*/}"
            [[ "${entry%% *}" == 100644 || "${entry%% *}" == 100755 ]] || continue
            [[ "$name" == test-*.sh ]] || continue
            git show "$main:$path" > "$RUNNER_TEMP/fixtures/$name"
            names+=("$name")
          done < "$RUNNER_TEMP/tree"
          if ((${#names[@]} == 0)); then
            echo "::error::origin/main ($main) has no .fork/tests/test-*.sh"
            exit 1
          fi
          status=0
          for name in "${names[@]}"; do
            echo "::group::$name"
            if ! bash "$RUNNER_TEMP/fixtures/$name"; then
              echo "::error::$name failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

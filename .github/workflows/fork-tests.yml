# SPDX-License-Identifier: GPL-3.0-or-later
# The fixture tests for the fork tooling. A pull request that touches .fork/
# or the workflows runs every fixture, and the merge push re-runs them as a
# smoke test. The fixtures come from main, never from the pull request tree,
# so a changed pull request cannot fake the verdict. test-check-clean.sh
# needs the clean branch as a local branch; the first step materializes it
# from origin/clean.
name: fork-tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.fork/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.fork/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  tests:
    # GitHub moves the ubuntu-latest label to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Make clean a local branch
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/clean >/dev/null; then
            echo "FAIL: origin/clean is missing; run .fork/sync-upstream.sh once" >&2
            exit 1
          fi
          git branch --no-track clean origin/clean
      - name: Run the fixtures from main
        # Every fixture that main carries runs. A pull request that adds a
        # fixture cannot run it here until the fixture is on main.
        run: |
          status=0
          for path in $(git ls-tree --name-only origin/main .fork/tests/); do
            name="$(basename "$path")"
            git show "origin/main:$path" > "$RUNNER_TEMP/$name"
            echo "::group::$name"
            bash "$RUNNER_TEMP/$name" || status=1
            echo "::endgroup::"
          done
          exit "$status"

# SPDX-License-Identifier: GPL-3.0-or-later
# The fixture tests for the fork tooling, in CI: every pull request that
# touches .fork/ or the workflows runs both fixture tests. A local session
# runs the same fixtures by hand:
#   .fork/tests/test-check-clean.sh
#   .fork/tests/test-sync-upstream.sh
#
# test-check-clean.sh needs the clean branch as a local branch, which a CI
# checkout does not have. The first step materializes it from origin/clean.
# test-sync-upstream.sh is hermetic: two local bare repositories stand in for
# upstream and origin, and a stub gh stands in for GitHub.
name: fork-tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.fork/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # GitHub moves the ubuntu-latest label to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Make clean a local branch
        run: git branch --no-track clean origin/clean
      - name: Run the check-clean fixture
        run: bash .fork/tests/test-check-clean.sh
      - name: Run the sync fixture
        run: bash .fork/tests/test-sync-upstream.sh

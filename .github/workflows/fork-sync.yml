# SPDX-License-Identifier: GPL-3.0-or-later
# The daily sync of upstream/main into the fork's main: fast-forward clean,
# merge it into main through an auto-merged pull request, and open an issue
# when a conflict stops it. A local session runs the same script:
# .fork/sync-upstream.sh
#
# The git pushes run on SYNC_TOKEN (Contents and Workflows write): the
# workflow token can never push a change to a workflow file, and upstream
# edits .github/workflows/ regularly (#33). The gh calls run on the workflow
# token; pull request creation needs the repository setting "Allow GitHub
# Actions to create and approve pull requests" left on (#31).
name: fork-sync

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check the push token
        env:
          PUSH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [[ -z "$PUSH_TOKEN" ]]; then
            echo "SYNC_TOKEN is missing. The git pushes need a fine-grained token with Contents: write and Workflows: write." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the script pushes clean and the sync branch with this token
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Merge upstream/main into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: .fork/sync-upstream.sh

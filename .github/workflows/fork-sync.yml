# SPDX-License-Identifier: GPL-3.0-or-later
# The daily sync of upstream/main into the fork's main: fast-forward clean,
# merge it into main through an auto-merged pull request, and open an issue
# when a conflict stops it. A local session runs the same script:
# .fork/sync-upstream.sh
#
# Every step runs on a GitHub App installation token
# (actions/create-github-app-token). The workflow token can never push a
# workflow-file change, and it intermittently cannot create pull requests at
# all (#33, #410). The App carries Contents, Workflows, Issues, and Pull
# requests write.
name: fork-sync

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    # GitHub moves the ubuntu-latest label to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - name: Check the App secrets
        env:
          APP_ID: ${{ secrets.SYNC_APP_ID }}
          APP_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo "SYNC_APP_ID and SYNC_APP_PRIVATE_KEY must both be set; see docs/fork.md." >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the script pushes clean and the sync branch with this token
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Merge upstream/main into main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .fork/sync-upstream.sh
